<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="scene-title scene-desc"><style>text{font:19px system-ui;fill:#edf2f8}.small{font-size:16px}</style><rect width="1100" height="700" fill="#152332"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#b5dbdf"></path></marker><marker id="bar" markerWidth="9" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M6 0V12" stroke="#f6c36b" stroke-width="3"></path></marker></defs><title id="scene-title">Hypothalamic pituitary testicular control</title><desc id="scene-desc">Parallel FSH and LH routes; selective inhibin feedback; steroid feedback and local androgen action.</desc><path d="M550 80V130" fill="none" stroke="#a4e4d2" stroke-width="2.4" marker-end="url(#arrow)" data-edge-id="GnRH-pit" data-kind="activation"></path><path d="M420 160H285V260" fill="none" stroke="#a4e4d2" stroke-width="2.4" marker-end="url(#arrow)" data-edge-id="pit-FSH" data-kind="activation"></path><path d="M680 160H825V260" fill="none" stroke="#a4e4d2" stroke-width="2.4" marker-end="url(#arrow)" data-edge-id="pit-LH" data-kind="activation"></path><path d="M285 315V380" fill="none" stroke="#a4e4d2" stroke-width="2.4" marker-end="url(#arrow)" data-edge-id="FSH-Sertoli" data-kind="activation"></path><path d="M825 315V380" fill="none" stroke="#a4e4d2" stroke-width="2.4" marker-end="url(#arrow)" data-edge-id="LH-Leydig" data-kind="activation"></path><path d="M285 450V510" fill="none" stroke="#a4e4d2" stroke-width="2.4" marker-end="url(#arrow)" data-edge-id="Sertoli-inhibin" data-kind="activation"></path><path d="M825 450V510" fill="none" stroke="#a4e4d2" stroke-width="2.4" marker-end="url(#arrow)" data-edge-id="Leydig-T" data-kind="activation"></path><path d="M700 540H500V420H410" fill="none" stroke="#a4e4d2" stroke-width="2.4" marker-end="url(#arrow)" data-edge-id="T-support" data-kind="activation"></path><path d="M160 540H70V285H150" fill="none" stroke="#f6c36b" stroke-width="2.4" marker-end="url(#bar)" data-edge-id="inhibin-FSH" data-kind="inhibition"></path><path d="M950 540H1040V50H690" fill="none" stroke="#f6c36b" stroke-width="2.4" marker-end="url(#bar)" data-edge-id="T-hyp" data-kind="inhibition"></path><path d="M950 540H1000V110H650V120" fill="none" stroke="#f6c36b" stroke-width="2.4" marker-end="url(#bar)" data-edge-id="T-pit" data-kind="inhibition"></path><rect x="420" y="20" width="260" height="60" rx="8" fill="#203448" stroke="#7893ac" stroke-width="1.5" data-node-id="hyp"></rect><text x="432" y="45" class="small">Hypothalamus: GnRH</text><text x="432" y="67" class="small">portal blood → pituitary</text><rect x="420" y="130" width="260" height="60" rx="8" fill="#203448" stroke="#7893ac" stroke-width="1.5" data-node-id="pit"></rect><text x="432" y="155" class="small">Anterior pituitary</text><text x="432" y="177" class="small">parallel gonadotropins</text><rect x="160" y="260" width="250" height="55" rx="8" fill="#203448" stroke="#7893ac" stroke-width="1.5" data-node-id="FSH"></rect><text x="172" y="285" class="small">FSH in blood</text><rect x="700" y="260" width="250" height="55" rx="8" fill="#203448" stroke="#7893ac" stroke-width="1.5" data-node-id="LH"></rect><text x="712" y="285" class="small">LH in blood</text><rect x="160" y="380" width="250" height="70" rx="8" fill="#203448" stroke="#7893ac" stroke-width="1.5" data-node-id="Sertoli"></rect><text x="172" y="405" class="small">Sertoli cells</text><text x="172" y="427" class="small">germ-cell support</text><rect x="700" y="380" width="250" height="70" rx="8" fill="#203448" stroke="#7893ac" stroke-width="1.5" data-node-id="Leydig"></rect><text x="712" y="405" class="small">Leydig cells</text><text x="712" y="427" class="small">androgen production</text><rect x="160" y="510" width="250" height="60" rx="8" fill="#203448" stroke="#7893ac" stroke-width="1.5" data-node-id="inhibin"></rect><text x="172" y="535" class="small">Inhibin B</text><text x="172" y="557" class="small">FSH-selective feedback</text><rect x="700" y="510" width="250" height="60" rx="8" fill="#203448" stroke="#7893ac" stroke-width="1.5" data-node-id="steroid"></rect><text x="712" y="535" class="small">Endogenous testosterone</text><text x="712" y="557" class="small">local action / blood signal</text><text x="85" y="345" class="small">Inhibits FSH</text><text x="520" y="405" class="small">Local androgen</text><text x="520" y="430" class="small">support</text><text x="745" y="100" class="small">Steroid feedback → upstream</text><text x="25" y="695" class="small">Bar ends: inhibition. Arrows: signaling / production; no hormone travels in a sperm duct.</text></svg>
