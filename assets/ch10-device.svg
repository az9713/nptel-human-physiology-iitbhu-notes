<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Capsule and proposed macrodevice have separate blood, host and graft regions</title><desc id="desc">Original schematic. Blood cells stay in vessel lumens. Solutes cross vessel wall, host tissue and a selective boundary to reach protected islets. A source-proposed rectangular block has distinct vascular and protected compartments, not a validated clinical architecture.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto-start-reverse"><path d="M0 0L8 3.5L0 7" fill="none" stroke="#f3c982"/></marker></defs><rect width="1000" height="590" fill="#14232e"/><g font-family="system-ui,sans-serif" fill="#eaf1f5" font-size="18"><text x="25" y="35">A. Microcapsule in host tissue</text><text x="505" y="35">B. Proposed macrodevice: section</text><rect x="35" y="75" width="410" height="50" rx="20" fill="#703e4d" stroke="#e9a2ac" stroke-width="4"/><text x="60" y="108">Blood lumen (cells remain inside)</text><circle cx="240" cy="285" r="115" fill="#254756" stroke="#79d2c3" stroke-width="9"/><g fill="#b7a4d5"><circle cx="220" cy="268" r="25"/><circle cx="265" cy="300" r="24"/><circle cx="212" cy="315" r="22"/></g><text x="173" y="360">Protected islets</text><path d="M240 130V235" stroke="#f3c982" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M290 260L380 190" stroke="#f3c982" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="280" y="160">Solute route</text><circle cx="85" cy="270" r="24" fill="#be8d67"/><text x="20" y="320">Host immune cell</text><text x="85" y="435">Selective material boundary</text><text x="68" y="470">Host interstitium outside capsule</text><rect x="505" y="75" width="465" height="340" rx="8" fill="#2b4551" stroke="#79d2c3" stroke-width="6"/><rect x="525" y="105" width="425" height="80" rx="17" fill="#703e4d" stroke="#e9a2ac" stroke-width="5"/><text x="545" y="140">Host-connected vascular lumen</text><text x="545" y="166">Perfusion must be established</text><rect x="530" y="260" width="415" height="130" rx="8" fill="#254756" stroke="#79d2c3" stroke-width="5"/><g fill="#b7a4d5"><circle cx="580" cy="300" r="19"/><circle cx="640" cy="335" r="24"/><circle cx="720" cy="295" r="21"/><circle cx="800" cy="335" r="23"/><circle cx="880" cy="305" r="20"/></g><text x="560" y="375">Protected endocrine compartment</text><path d="M690 190V270" stroke="#f3c982" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="710" y="230">Wall + tissue + selective boundary</text><text x="510" y="450">Source proposal form factor: 16 × 10 × 4 mm</text><text x="510" y="480">Lumens and barriers exaggerated for explanation</text><text x="25" y="535">Illustrative colors; panels at separate scales. No observed growth, clinical product or transport rate implied.</text><text x="25" y="565">Oxygen/glucose enter; insulin/waste leave. Immune isolation and vascular access remain separate constraints.</text></g></svg>