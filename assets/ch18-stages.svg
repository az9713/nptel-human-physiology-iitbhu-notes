small">Cells: 4</text><text x="765" y="232" class="small">Per cell: 1n / 1C</text><text x="765" y="274" class="small">Chromosomes per cell: 23</text><text x="765" y="316" class="small">Chromatids per cell: 23</text><text x="765" y="358" class="small">Cohort DNA: 4C</text><text x="765" y="435" class="small">Cohort DNA (C-equivalents)</text><rect x="770" y="455" width="260" height="32" fill="#253b50" stroke="#7893ac"></rect><rect x="770" y="455" width="260" height="32" fill="#8dc8fc" data-DNA-C="4"></rect><text x="765" y="512" class="small">0</text><text x="830" y="512" class="small">1</text><text x="895" y="512" class="small">2</text><text x="960" y="512" class="small">3</text><text x="1025" y="512" class="small">4</text><text x="765" y="555" class="small">S phase adds DNA; divisions</text><text x="765" y="580" class="small">redistribute it. Shaping adds</text><text x="765" y="605" class="small">no new chromosome set.</text></svg>
