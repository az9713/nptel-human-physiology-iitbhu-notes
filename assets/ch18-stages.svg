<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="scene-title scene-desc"><style>text{font:19px system-ui;fill:#edf2f8}.small{font-size:16px}</style><rect width="1100" height="700" fill="#152332"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#b5dbdf"></path></marker><marker id="bar" markerWidth="9" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M6 0V12" stroke="#f6c36b" stroke-width="3"></path></marker></defs><title id="scene-title">One committed germ-cell lineage</title><desc id="scene-desc">Basal precursor toward lumen; completed human n and C counts, one illustrative chromosome pair only.</desc><rect x="30" y="50" width="690" height="100" fill="#213e4b"></rect><rect x="30" y="150" width="690" height="275" fill="#333b54"></rect><rect x="30" y="425" width="690" height="100" fill="#4b3c4e"></rect><rect x="30" y="530" width="690" height="60" fill="#344631"></rect><text x="45" y="100" class="small">Lumen</text><text x="45" y="235" class="small">Adluminal epithelium</text><text x="45" y="455" class="small">Basal region</text><text x="45" y="565" class="small">Interstitium: Leydig / blood outside tubule</text><path d="M30 425H720" fill="none" stroke="#f6c36b" stroke-width="3" stroke-dasharray="7 5"></path><path d="M30 528H720" fill="none" stroke="#e3cad7" stroke-width="5"></path><path d="M180 525L166 220Q180 170 200 220L222 525" fill="#438b83" opacity="0.8"></path><path d="M610 525L596 220Q610 170 630 220L652 525" fill="#438b83" opacity="0.8"></path><ellipse cx="230" cy="125" rx="12" ry="22" fill="#9b6688" stroke="#f2c6df" stroke-width="2" data-cell="0"></ellipse><path d="M230 103Q210 88 235 53" fill="none" stroke="#efb7d3" stroke-width="3"></path><ellipse cx="230" cy="125" rx="6.6000000000000005" ry="14.3" fill="#352a48"></ellipse><rect x="227" y="93" width="6" height="10" fil