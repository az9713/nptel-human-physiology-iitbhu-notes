<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="850" viewBox="0 0 1180 850" role="img" aria-labelledby="svg-title svg-desc"><style>text{font:19px system-ui;fill:#edf2f8}.small{font-size:16px}</style><rect width="1180" height="850" fill="#152332"/><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10" fill="none" stroke="#c7dce4" stroke-width="2"></path></marker></defs><title id="svg-title">Located sensors and branching renal hormones</title><desc id="svg-desc">All arrows belong to one branching reaction/control graph. The liver supplies substrate; renin and endothelial ACE catalyse different conversions. AngII has four separate targets. Potassium is an independent adrenal input. Improved sensed filling inhibits renin drive; the bar-ended edge is negative feedback. The separate ANP route is not a downstream RAAS step. Timing is explanatory, not endocrine kinetics.</desc><defs><marker id="inhibit" markerWidth="8" markerHeight="18" refX="1" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1V17" stroke="#efb4d0" stroke-width="3"></path></marker></defs><path d="M190 105V150" fill="none" stroke="#7eaaaa" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="stimuli-renin" data-from="stimuli" data-to="renin" data-kind="activation"></path><path d="M565 105V130" fill="none" stroke="#7eaaaa" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="substrate-cleavage" data-from="substrate" data-to="cleavage" data-kind="activation"></path><path d="M360 185H400V160H430" fill="none" stroke="#7eaaaa" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)" data-edge-id="renin-catalysis" data-from="renin" data-to="cleavage" data-kind="enzyme"></path><path d="M565 190V230" fill="none" stroke="#7eaaaa" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="cleavage-angI" data-from="cleavage" data-to="angI" data-kind="activation"></path><path d="M565 285V360" fill="none" stroke="#7eaaaa" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="angi-conversion" data-from="angI" data-to="angII" data-kind="activation"></path><path d="M800 278H760V325H565" fill="none" stroke="#7eaaaa" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)" data-edge-id="ace-catalysis" data-from="ace" data-to="angi-conversion" data-kind="enzyme"></path><path d="M430 387H150V470" fill="none" stroke="#7eaaaa" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="angII-vascular" data-from="angII" data-to="vascular" data-kind="activation"></path><path d="M565 415V440H435V470" fill="none" stroke="#7eaaaa" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="angII-proximal" data-from="angII" data-to="proximal" data-kind="activation"></path><path d="M700 387H720V470" fill="none" stroke="#7eaaaa" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="angII-adh" data-from="angII" data-to="adh" data-kind="activation"></path><path d="M700 387H862V500H875" fill="none" stroke="#7eaaaa" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="angII-adrenal" data-from="angII" data-to="adrenal" data-kind="activation"></path><path d="M1017 415V470" fill="none" stroke="#7eaaaa" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="potassium-adrenal" data-from="potassium" data-to="adrenal" data-kind="activation"></path><path d="M1017 545V610" fill="none" stroke="#7eaaaa" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="aldosterone-distal" data-from="adrenal" data-to="distal" data-kind="activation"></path><path d="M150 545V710H380V735" fill="none" stroke="#ffe29a" stroke-width="3.5" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="vascular-filling" data-from="vascular" data-to="filling" data-kind="activation"></path><path d="M435 545V735" fill="none" stroke="#ffe29a" stroke-width="3.5" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="proximal-filling" data-from="proximal" data-to="filling" data-kind="activation"></path><path d="M720 545V700H650V735" fill="none" stroke="#ffe29a" stroke-width="3.5" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="adh-filling" data-from="adh" data-to="filling" data-kind="activation"></path><path d="M1017 685V765H760" fill="none" stroke="#ffe29a" stroke-width="3.5" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="distal-filling" data-from="distal" data-to="filling" data-kind="activation"></path><path d="M350 765H5V185H12" fill="none" stroke="#ffe29a" stroke-width="3.5" stroke-dasharray="none" marker-end="url(#inhibit)" data-edge-id="filling-inhibits-renin" data-from="filling" data-to="renin" data-kind="inhibition"></path><path d="M970 75V100" fill="none" stroke="#7eaaaa" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="atrial-anp" data-from="atrial" data-to="anp" data-kind="activation"></path><path d="M970 155V180" fill="none" stroke="#7eaaaa" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" data-edge-id="anp-natriuresis" data-from="anp" data-to="natriuresis" data-kind="activation"></path><rect x="20" y="20" width="340" height="85" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="stimuli"></rect><text x="32" y="43" class="small">Renal perfusion ↓ / low NaCl</text><text x="32" y="65" class="small">at macula densa / sympathetic drive</text><text x="32" y="87" class="small">Renin-release stimuli</text><rect x="20" y="150" width="340" height="70" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="renin"></rect><text x="32" y="173" class="small">Kidney granular cells</text><text x="32" y="195" class="small">Renin release ↑ (enzyme)</text><rect x="430" y="20" width="270" height="85" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="substrate"></rect><text x="442" y="43" class="small">Liver supplies circulating</text><text x="442" y="65" class="small">angiotensinogen</text><text x="442" y="87" class="small">(circulating substrate)</text><rect x="430" y="130" width="270" height="60" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="cleavage"></rect><text x="442" y="153" class="small">Renin cleavage</text><text x="442" y="175" class="small">of angiotensinogen</text><rect x="430" y="230" width="270" height="55" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="angI"></rect><text x="442" y="253" class="small">Angiotensin I</text><rect x="800" y="250" width="340" height="55" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="ace"></rect><text x="812" y="273" class="small">Endothelial ACE (enzyme)</text><rect x="430" y="360" width="270" height="55" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="angII"></rect><text x="442" y="383" class="small">Angiotensin II</text><rect x="875" y="360" width="285" height="55" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="potassium"></rect><text x="887" y="383" class="small">Extracellular K+ ↑</text><text x="887" y="405" class="small">Independent adrenal input</text><rect x="20" y="470" width="260" height="75" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="vascular"></rect><text x="32" y="493" class="small">Vascular smooth muscle</text><text x="32" y="515" class="small">Contraction / resistance</text><rect x="305" y="470" width="260" height="75" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="proximal"></rect><text x="317" y="493" class="small">Proximal nephron</text><text x="317" y="515" class="small">Sodium recovery</text><rect x="590" y="470" width="260" height="75" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="adh"></rect><text x="602" y="493" class="small">Thirst / ADH pathways</text><text x="602" y="515" class="small">Water intake / recovery</text><rect x="875" y="470" width="285" height="75" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="adrenal"></rect><text x="887" y="493" class="small">Adrenal zona glomerulosa</text><text x="887" y="515" class="small">Aldosterone</text><rect x="875" y="610" width="285" height="75" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="distal"></rect><text x="887" y="633" class="small">Distal ENaC / Na-K ATPase</text><text x="887" y="655" class="small">Na recovery / K secretion</text><rect x="350" y="735" width="410" height="60" rx="8" fill="#315d61" stroke="#a9f0cd" stroke-width="3" data-node-id="filling"></rect><text x="362" y="758" class="small">Improved sensed arterial filling</text><text x="362" y="780" class="small">if responses are effective</text><rect x="800" y="20" width="340" height="55" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="atrial"></rect><text x="812" y="43" class="small">Atrial stretch ↑ (separate input)</text><rect x="800" y="100" width="340" height="55" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="anp"></rect><text x="812" y="123" class="small">ANP ↑</text><rect x="800" y="180" width="340" height="45" rx="8" fill="#213448" stroke="#70859b" stroke-width="1.5" data-node-id="natriuresis"></rect><text x="812" y="203" class="small">Natriuresis (sodium excretion)</text><text x="580" y="315" class="small">ACE conversion</text><text x="20" y="820" class="small">Negative feedback: improved sensed filling inhibits renin drive (bar-ended edge).</text></svg>
