<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc"><title id="title">Different respiratory failures affect different routes</title><desc id="desc">Three schematic panels distinguish conducting gas flow, tissue expansion and gas exchange, and pulmonary perfusion. Shapes are abstract compartments, not anatomy.</desc><rect width="1040" height="560" fill="#14232e"/><style>text{fill:#ecf3f8;font-family:system-ui;font-size:20px}.small{font-size:17px}.head{font-size:23px;font-weight:bold}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#72d5c0"/></marker></defs><text x="32" y="40" class="head">Abstract transport compartments — separate failure mechanisms</text>
<g transform="translate(25 75)"><rect width="315" height="440" rx="12" fill="#203a49"/><text x="20" y="38" class="head">Airway route</text><rect x="40" y="80" width="235" height="65" rx="15" fill="#35667b"/><text x="60" y="121">Gas lumen</text><path d="M45 210H120L150 235L180 210H275M45 290H120L150 265L180 290H275" fill="none" stroke="#e5af70" stroke-width="15"/><path d="M45 250H260" stroke="#72d5c0" stroke-width="4" marker-end="url(#a)"/><text x="20" y="338">Narrowing / mucus</text><text x="20" y="374" class="small">Asthma, chronic bronchitis</text><text x="20" y="405" class="small">Changed flow resistance</text></g>
<g transform="translate(362 75)"><rect width="315" height="440" rx="12" fill="#203a49"/><text x="20" y="38" class="head">Exchange tissue</text><rect x="30" y="80" width="255" height="70" fill="#35667b"/><text x="50" y="121">Alveolar gas</text><rect x="30" y="165" width="255" height="70" fill="#836a83"/><text x="48" y="207">Thickened barrier</text><rect x="30" y="250" width="255" height="55" fill="#844752"/><text x="70" y="286">Blood space</text><text x="20" y="338">Scarring / stiffness</text><text x="20" y="374" class="small">Fibrosis; some sarcoidosis</text><text x="20" y="405" class="small">Expansion and exchange</text></g>
<g transform="translate(699 75)"><rect width="315" height="440" rx="12" fill="#203a49"/><text x="20" y="38" class="head">Pulmonary vessels</text><rect x="30" y="80" width="255" height="70" fill="#35667b"/><text x="50" y="121">Ventilated gas</text><rect x="30" y="195" width="255" height="80" rx="15" fill="#844752"/><path d="M40 235H120" stroke="#72d5c0" stroke-width="4" marker-end="url(#a)"/><rect x="150" y="200" width="35" height="70" fill="#d9aa60"/><text x="20" y="338">Obstructed blood route</text><text x="20" y="374" class="small">Pulmonary embolism</text><text x="20" y="405" class="small">Perfusion ≠ ventilation</text></g></svg>