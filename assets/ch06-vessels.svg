<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="ch6v-title ch6v-desc"><title id="ch6v-title">Vessel walls and three capillary organizations</title><desc id="ch6v-desc">Original shaded sectional artery and vein comparison above three separate flat capillary barrier schematics. Shapes and dimensions are illustrative.</desc><defs><radialGradient id="ch6v-media"><stop offset="0.55" stop-color="#b77e87"/><stop offset="0.85" stop-color="#dcb2ad"/><stop offset="1" stop-color="#825566"/></radialGradient><radialGradient id="ch6v-outer"><stop offset="0.55" stop-color="#997b59"/><stop offset="0.9" stop-color="#c6ae81"/><stop offset="1" stop-color="#766247"/></radialGradient><radialGradient id="ch6v-lumen"><stop stop-color="#4c172b"/><stop offset="1" stop-color="#7c3549"/></radialGradient></defs><rect width="960" height="650" rx="14" fill="#14232e"/><style>text{font:18px system-ui;fill:#edf3f6}.small{font-size:15px;fill:#c7d9df}.line{stroke:#b8c7cf;stroke-width:1.5;fill:none}</style><text x="28" y="32">Larger-vessel wall organization — separate, uncalibrated sections</text><circle cx="180" cy="165" r="109" fill="url(#ch6v-outer)"/><circle cx="180" cy="165" r="91" fill="url(#ch6v-media)"/><circle cx="180" cy="165" r="56" fill="#85b4bb"/><circle cx="180" cy="165" r="49" fill="url(#ch6v-lumen)"/><text x="145" y="171">Lumen</text><text x="107" y="299">Artery (generic)</text><ellipse cx="610" cy="165" rx="150" ry="94" fill="url(#ch6v-outer)"/><ellipse cx="610" cy="165" rx="135" ry="80" fill="url(#ch6v-media)"/><ellipse cx="610" cy="165" rx="123" ry="69" fill="#85b4bb"/><ellipse cx="610" cy="165" rx="116" ry="62" fill="url(#ch6v-lumen)"/><text x="582" y="171">Lumen</text><text x="567" y="299">Vein (generic)</text><path class="line" d="M237 165H320M257 120L320 105M284 200L320 230"/><text x="325" y="110">Media</text><text class="small" x="325" y="130">muscle / elastic material</text><text x="325" y="170">Intima</text><text class="small" x="325" y="190">endothelial lining</text><text x="325" y="235">Externa</text><text class="small" x="325" y="255">outer connective tissue</text><text x="28" y="350">Capillary barriers — lumen above / interstitium below; not the same scale as vessels</text><text x="35" y="390">Continuous</text><text x="350" y="390">Fenestrated</text><text x="665" y="390">Discontinuous</text><g fill="#538e9b"><rect x="30" y="425" width="120" height="52" rx="8"/><rect x="156" y="425" width="120" height="52" rx="8"/><rect x="345" y="425" width="246" height="52" rx="8"/><rect x="660" y="425" width="87" height="52" rx="8"/><rect x="789" y="425" width="115" height="52" rx="8"/></g><g stroke="#a5cf9b" stroke-width="4"><path d="M30 418H276M345 418H591M660 418H747M789 418H904"/></g><g fill="#14232e"><ellipse cx="390" cy="451" rx="9" ry="27"/><ellipse cx="455" cy="451" rx="9" ry="27"/><ellipse cx="520" cy="451" rx="9" ry="27"/></g><g stroke="#d8b989" stroke-width="5"><path d="M30 490H276M345 490H591M660 490H730M808 490H904"/></g><text class="small" x="30" y="525">No endothelial fenestrae</text><text class="small" x="30" y="549">Junction / cell routes vary</text><text class="small" x="345" y="525">Pores through cells</text><text class="small" x="345" y="549">Not blood-cell-sized exits</text><text class="small" x="660" y="525">Tissue-specific openings</text><text class="small" x="660" y="549">Supporting layer may differ</text><rect x="30" y="582" width="22" height="12" fill="#538e9b"/><text class="small" x="61" y="594">Endothelium</text><path d="M280 589H305" stroke="#a5cf9b" stroke-width="4"/><text class="small" x="316" y="594">Luminal surface layer</text><path d="M590 589H615" stroke="#d8b989" stroke-width="5"/><text class="small" x="628" y="594">Basement-membrane context</text><text class="small" x="30" y="627">No specimen, measured diameter, pore scale, universal permeability or live-flow inference.</text></svg>