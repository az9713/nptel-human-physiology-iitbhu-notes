<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-label="Three clocks: illustrative near-day-14 fertilization">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d5e8f6"/></marker></defs>
<rect width="1100" height="580" fill="#102032"/>
<text x="35" y="48" fill="#f1f6fc" font-family="system-ui" font-size="28" font-weight="700">Three clocks: illustrative near-day-14 fertilization</text>
<text x="60" y="115" fill="#bdd4e5" font-family="system-ui" font-size="18">Cycle events</text>
<path d="M100 140 L990 140" stroke="#7da9c7" stroke-width="4"/>
<circle cx="100" cy="140" r="8" fill="#efc06e"/>
<text x="100" y="173" text-anchor="middle" fill="white" font-family="system-ui" font-size="17">day 1: bleeding</text>
<circle cx="540" cy="140" r="8" fill="#efc06e"/>
<text x="540" y="173" text-anchor="middle" fill="white" font-family="system-ui" font-size="17">near day 14: ovulation</text>
<circle cx="980" cy="140" r="8" fill="#efc06e"/>
<text x="980" y="173" text-anchor="middle" fill="white" font-family="system-ui" font-size="17">next onset: +28 d</text>
<text x="60" y="265" fill="#bdd4e5" font-family="system-ui" font-size="18">After fertilization</text>
<path d="M100 290 L990 290" stroke="#7da9c7" stroke-width="4"/>
<circle cx="540" cy="290" r="8" fill="#efc06e"/>
<text x="540" y="323" text-anchor="middle" fill="white" font-family="system-ui" font-size="17">0</text>
<circle cx="750" cy="290" r="8" fill="#efc06e"/>
<text x="750" y="323" text-anchor="middle" fill="white" font-family="system-ui" font-size="17">~7: implantation begins</text>
<circle cx="980" cy="290" r="8" fill="#efc06e"/>
<text x="980" y="323" text-anchor="middle" fill="white" font-family="system-ui" font-size="17">~14</text>
<text x="60" y="415" fill="#bdd4e5" font-family="system-ui" font-size="18">Gestational age from LMP</text>
<path d="M100 440 L990 440" stroke="#7da9c7" stroke-width="4"/>
<circle cx="100" cy="440" r="8" fill="#efc06e"/>
<text x="100" y="473" text-anchor="middle" fill="white" font-family="system-ui" font-size="17">0 weeks</text>
<circle cx="540" cy="440" r="8" fill="#efc06e"/>
<text x="540" y="473" text-anchor="middle" fill="white" font-family="system-ui" font-size="17">~2 weeks</text>
<circle cx="980" cy="440" r="8" fill="#efc06e"/>
<text x="980" y="473" text-anchor="middle" fill="white" font-family="system-ui" font-size="17">~4 weeks</text>
</svg>