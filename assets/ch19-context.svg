<ellipse cx="245" cy="755" rx="205" ry="150" fill="#493b56" stroke="#ffbf76" stroke-width="4"/><ellipse cx="245" cy="755" rx="105" ry="85" fill="#6a3b4e"/>
<circle cx="120" cy="690" r="14" fill="#7be4b1"/><circle cx="180" cy="650" r="23" fill="#7be4b1"/><circle cx="345" cy="690" r="42" fill="#1d4661" stroke="#7be4b1" stroke-width="8"/>
<text x="25" y="940">Cortex: follicles in stromal tissue</text><path d="M135 915L115 800" class="lead"/>
<text x="25" y="980">Medulla: vessels, nerves, connective tissue</text><path d="M235 952L235 800" class="lead"/>
<text x="25" y="1035" class="small">Follicle symbols show coexistence, not a measured distribution.</text>
