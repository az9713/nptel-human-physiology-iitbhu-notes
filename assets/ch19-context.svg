<circle cx="765" cy="755" r="150" fill="#5d3d51" stroke="#ffbf76" stroke-width="18"/><circle cx="765" cy="755" r="135" fill="#27534f" stroke="#e3e9f0" stroke-width="4"/><circle cx="790" cy="745" r="94" fill="#163650"/>
