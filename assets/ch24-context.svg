<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-label="Membrane and chemical synapse: separate compartments"><rect width="100%" height="100%" fill="#101c2c"/><text x="30" y="42" fill="#f0f4fb" font-family="system-ui" font-size="27" font-weight="700">Membrane and chemical synapse: separate compartments</text><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#c5e3fa"/></marker></defs><text x="40" y="94" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="19">A. Membrane patch: V = inside − outside</text><rect x="40" y="117" width="465" height="215" rx="12" fill="#263e59" stroke="#779ab5"/><text x="60" y="152" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="18">Extracellular fluid (outside)</text><path d="M65 213H480" stroke="#d5a778" stroke-width="16"/><text x="60" y="285" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="18">Cytosol (inside)</text><rect x="95" y="178" width="96" height="70" rx="12" fill="#405f7d" stroke="#8eb7d0"/><text x="143.0" y="205.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">Na⁺</text><text x="143.0" y="230.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">channel</text><rect x="235" y="178" width="96" height="70" rx="12" fill="#405f7d" stroke="#8eb7d0"/><text x="283.0" y="205.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">K⁺</text><text x="283.0" y="230.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">channel</text><rect x="380" y="178" width="85" height="70" rx="12" fill="#405f7d" stroke="#8eb7d0"/><text x="422.5" y="205.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">3 Na⁺ out</text><text x="422.5" y="230.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">2 K⁺ in</text><text x="56" y="315" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="15">Selective channels carry current; ATPase maintains gradients.</text><text x="565" y="94" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="19">B. Presynaptic terminal to postsynaptic cell</text><rect x="575" y="125" width="195" height="90" rx="12" fill="#294965" stroke="#8eb7d0"/><text x="672.5" y="162.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">Presynaptic</text><text x="672.5" y="187.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">cytosol</text><rect x="830" y="125" width="210" height="90" rx="12" fill="#294965" stroke="#8eb7d0"/><text x="935.0" y="162.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">Vesicle membrane</text><text x="935.0" y="187.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">synaptobrevin</text><path d="M770 169L830 169" fill="none" stroke="#c5e3fa" stroke-width="3" marker-end="url(#arrow)"/><path d="M570 280H1040" stroke="#d5a778" stroke-width="15"/><text x="585" y="266" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="16">Presynaptic plasma membrane: syntaxin + SNAP-25</text><rect x="605" y="330" width="405" height="62" rx="12" fill="#51445c" stroke="#8eb7d0"/><text x="807.5" y="366.0" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">Extracellular synaptic cleft</text><path d="M850 289L850 324" fill="none" stroke="#c5e3fa" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="424" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="17">Postsynaptic receptor conductance changes V toward its Erev</text><rect x="640" y="448" width="335" height="75" rx="12" fill="#355b62" stroke="#8eb7d0"/><text x="807.5" y="490.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">Postsynaptic cytosol</text><text x="47" y="580" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="17">Ca²⁺ enters through terminal voltage-gated channels; synaptotagmin senses Ca²⁺.</text><text x="47" y="612" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="17">Primed SNAREs support fusion; a pore opens, transmitter crosses cleft, then is cleared.</text><text x="47" y="645" text-anchor="start" fill="#b9cee0" font-family="system-ui" font-size="15">Topological sketch only: no molecular geometry, distances, rates or species are measured.</text></svg>
