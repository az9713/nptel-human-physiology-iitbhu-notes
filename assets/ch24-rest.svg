<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-label="One-ion reversal and maintained multi-ion rest"><rect width="100%" height="100%" fill="#101c2c"/><text x="30" y="42" fill="#f0f4fb" font-family="system-ui" font-size="27" font-weight="700">One-ion reversal and maintained multi-ion rest</text><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#c5e3fa"/></marker></defs><rect x="55" y="115" width="220" height="90" rx="12" fill="#294965" stroke="#8eb7d0"/><text x="165.0" y="152.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">K⁺ only</text><text x="165.0" y="177.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">E_K ≈ −95.0 mV</text><rect x="325" y="115" width="220" height="90" rx="12" fill="#294965" stroke="#8eb7d0"/><text x="435.0" y="152.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">Na⁺ only</text><text x="435.0" y="177.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">E_Na ≈ +60.6 mV</text><rect x="595" y="115" width="440" height="90" rx="12" fill="#294965" stroke="#8eb7d0"/><text x="815.0" y="152.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">Synthetic multi-ion rest</text><text x="815.0" y="177.5" text-anchor="middle" fill="#e7f0f9" font-family="system-ui" font-size="17">V ≈ −68.75 mV</text><text x="55" y="255" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="18">Nernst: T=310.15 K, activities approximated by stated concentrations; one permeant ion.</text><text x="55" y="290" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="18">At its E_ion the net electrochemical flux of that ion is zero in the ideal equilibrium model.</text><text x="55" y="338" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="18">Rest construction: g_K=0.8, g_Na=0.15, g_other=0.25 mS/cm²;</text><text x="55" y="372" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="18">E_K=−90, E_Na=+60, E_other=−70 mV; outward pump current=2 µA/cm².</text><text x="55" y="415" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="18">Without the imposed pump current V=−67.08 mV; with it V=−68.75 mV.</text><text x="55" y="463" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="17">The 1.67 mV direct shift is conditional on these chosen conductances, not a universal pump voltage.</text><text x="55" y="520" text-anchor="start" fill="#e7f0f9" font-family="system-ui" font-size="18">Pump stoichiometry: 3 Na⁺ out / 2 K⁺ in per ATP; gradient maintenance acts over longer times.</text><text x="55" y="565" text-anchor="start" fill="#b9cee0" font-family="system-ui" font-size="16">This figure does not imply a physiological sequence 0 → −5 → −90 → −70 mV.</text></svg>
