<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IVF stage 5 and denominator" viewBox="0 0 1000 690"><title>IVF stage 5 and denominator</title><style>text{fill:#edf2fb;font:18px system-ui}.head{font-size:25px;font-weight:700}.small{font-size:15px}.green{fill:#7be4b1}.orange{fill:#ffbf76}</style><rect width="1000" height="690" fill="#101927"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#83c8ff"/></marker></defs><text x="25" y="38" class="head">IVF sequence and a synthetic linked-cycle cohort</text><text x="25" y="73" class="small">Each count is CYCLES meeting the event, not eggs, embryos, babies or people.</text><text x="25" y="128" class="small">Cycle starts</text><rect x="270" y="105" width="550" height="35" fill="#437c9c"/><text x="850" y="130" class="">100</text><text x="25" y="190" class="small">Actual retrieval</text><rect x="270" y="167" width="495" height="35" fill="#437c9c"/><text x="850" y="192" class="">90</text><text x="25" y="252" class="small">At least one fertilization</text><rect x="270" y="229" width="396" height="35" fill="#437c9c"/><text x="850" y="254" class="">72</text><text x="25" y="314" class="small">Embryo transfer</text><rect x="270" y="291" width="297" height="35" fill="#437c9c"/><text x="850" y="316" class="">54</text><text x="25" y="376" class="small">Clinical pregnancy</text><rect x="270" y="353" width="198" height="35" fill="#437c9c"/><text x="850" y="378" class="">36</text><text x="25" y="438" class="small">Live-birth delivery</text><rect x="270" y="415" width="148.5" height="35" fill="#ffbf76"/><text x="850" y="440" class="orange">27</text><text x="25" y="520" class="head">Delivery: downstream outcome</text><text x="25" y="565" class="">Reached 27/100 starts = 27.0%</text><text x="25" y="600" class="">Conditional on previous stage: 27/36 = 75.0%</text><text x="25" y="645" class="">Chosen cohort counts, not clinical rates. One linked transfer pathway and complete follow-up</text><text x="25" y="670" class="">assumed; real frozen/cumulative cycles require different linkage.</text></svg>