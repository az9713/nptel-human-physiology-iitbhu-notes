<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="Labor events, not a universal stopwatch">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d5e8f6"/></marker></defs>
<rect width="1000" height="600" fill="#102032"/>
<text x="35" y="48" fill="#f1f6fc" font-family="system-ui" font-size="28" font-weight="700">Labor events, not a universal stopwatch</text>
<rect x="35" y="210" width="205" height="105" rx="12" fill="#304964" stroke="#a9c4d9"/>
<text x="137.5" y="258.5" text-anchor="middle" fill="white" font-family="system-ui" font-size="19">Effacement and</text>
<text x="137.5" y="283.5" text-anchor="middle" fill="white" font-family="system-ui" font-size="19">dilation</text>
<path d="M240 262 L275 262" stroke="#d5e8f6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="275" y="210" width="205" height="105" rx="12" fill="#304964" stroke="#a9c4d9"/>
<text x="377.5" y="258.5" text-anchor="middle" fill="white" font-family="system-ui" font-size="19">Complete dilation</text>
<text x="377.5" y="283.5" text-anchor="middle" fill="white" font-family="system-ui" font-size="19">~10 cm</text>
<path d="M480 262 L515 262" stroke="#d5e8f6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="515" y="210" width="205" height="105" rx="12" fill="#304964" stroke="#a9c4d9"/>
<text x="617.5" y="268.5" text-anchor="middle" fill="white" font-family="system-ui" font-size="21">Infant birth</text>
<path d="M720 262 L755 262" stroke="#d5e8f6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="755" y="210" width="205" height="105" rx="12" fill="#5a4265" stroke="#a9c4d9"/>
<text x="857.5" y="258.5" text-anchor="middle" fill="white" font-family="system-ui" font-size="19">Placental</text>
<text x="857.5" y="283.5" text-anchor="middle" fill="white" font-family="system-ui" font-size="19">delivery</text>
<text x="40" y="435" fill="#bdd4e5" font-family="system-ui" font-size="18">Cervix: thinning ≠ opening. Stage 2 follows complete dilation; stage 3 follows infant birth.</text>
<text x="40" y="485" fill="#bdd4e5" font-family="system-ui" font-size="18">Cesarean birth uses abdominal and uterine incisions; the placenta is also delivered.</text>
</svg>