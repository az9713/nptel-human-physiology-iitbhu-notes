<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Sectional reconstruction of the glomerular filtration wall</title><desc id="desc">From capillary lumen at top to capsular space below: glycocalyx covers fenestrated endothelial cell surface and its window, a continuous extracellular glomerular basement membrane lies beneath, and two podocyte foot processes contact the outer basement membrane. A slit diaphragm bridges the gap between the foot processes. The blue arrow crosses this integrated wall into capsular space; blood cells remain in the capillary lumen. This is a locally flattened, unscaled explanatory section, not a micrograph.</desc>
<defs><marker id="ch16-barrier-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71dfdf"/></marker><pattern id="ch16-gbm-mesh" width="28" height="24" patternUnits="userSpaceOnUse"><path d="M0 0L28 24M28 0L0 24" stroke="#ddc6e8" stroke-width="1" opacity=".65"/></pattern></defs>
<rect width="1100" height="620" rx="12" fill="#14242e"/><rect id="ch16-capillary-lumen" x="280" y="60" width="610" height="120" fill="#483844"/><text x="300" y="95" fill="#fff" font-family="system-ui,sans-serif" font-size="23">Glomerular capillary lumen — blood side</text>
<ellipse cx="380" cy="135" rx="37" ry="15" fill="#bd7d83" stroke="#edafb3" stroke-width="3"/><text x="430" y="142" fill="#f1f4f6" font-family="system-ui,sans-serif" font-size="17">Retained cell</text>
<!-- Glycocalyx extends over luminal surface and fenestral region; exaggerated. -->
<path d="M280 193Q300 161 320 193Q340 160 360 193Q380 160 400 193Q420 160 440 193Q460 160 480 193Q500 160 520 193Q540 160 560 193Q580 160 600 193Q620 160 640 193Q660 160 680 193Q700 160 720 193Q740 160 760 193Q780 160 800 193Q820 160 840 193Q860 160 890 193" fill="none" stroke="#86cc94" stroke-width="9"/>
<g id="ch16-endothelium" fill="#bf8d6b" stroke="#e9c7a5" stroke-width="2"><rect x="280" y="199" width="245" height="45"/><rect x="615" y="199" width="275" height="45"/></g>
<g stroke="#86cc94" stroke-width="2"><path d="M535 181L540 235M550 180L558 239M565 183L572 236M583 180L590 236M600 183L603 238"/></g>
<rect id="ch16-gbm" x="280" y="244" width="610" height="66" fill="#765c8c" stroke="#d7c0e0" stroke-width="2"/><rect x="280" y="244" width="610" height="66" fill="url(#ch16-gbm-mesh)"/>
<!-- Opposing foot processes belong to distinct podocytes; slit between them. -->
<g id="ch16-podocytes" fill="#507a9d" stroke="#acd1e7" stroke-width="3"><path d="M300 310H525V375H433V433H365V375H300Z"/><path d="M615 310H875V375H790V433H717V375H615Z"/><ellipse cx="399" cy="462" rx="90" ry="48"/><ellipse cx="753" cy="462" rx="90" ry="48"/></g>
<path d="M525 343L538 334L551 350L564 334L577 350L590 334L603 350L615 343" fill="none" stroke="#f5dc8d" stroke-width="5"/>
<path d="M570 115V421" stroke="#71dfdf" stroke-width="7" stroke-dasharray="12 7" marker-end="url(#ch16-barrier-arrow)"/>
<g fill="#f1f4f6" font-family="system-ui,sans-serif" font-size="18"><text x="30" y="185">Glycocalyx / surface layer</text><text x="30" y="224">Fenestrated endothelium</text><text x="30" y="275">Continuous GBM matrix</text><text x="30" y="303" font-size="15">Collagen IV / laminin networks</text><text x="30" y="350">Slit diaphragm</text><text x="30" y="375" font-size="15">Nephrin-containing junction</text><text x="95" y="412">Foot process A</text><text x="914" y="410">Foot process B</text><text x="365" y="467" font-size="15">Podocyte A</text><text x="716" y="467" font-size="15">Podocyte B</text><text x="420" y="592" font-size="22">Capsular (urinary) space</text><text x="917" y="185">Positive</text><text x="917" y="209">filtration:</text><text x="917" y="238">lumen</text><text x="917" y="266">↓ wall ↓</text><text x="917" y="294">capsular space</text><text x="630" y="224" font-size="15">Cell fragment</text><text x="920" y="342" font-size="16">Fenestra</text></g>
