<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contraceptive method mechanism comparison" viewBox="0 0 1000 690"><title>Contraceptive method mechanism comparison</title><style>text{fill:#edf2fb;font:18px system-ui}.head{font-size:25px;font-weight:700}.small{font-size:15px}.green{fill:#7be4b1}.orange{fill:#ffbf76}</style><rect width="1000" height="690" fill="#101927"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#83c8ff"/></marker></defs><text x="25" y="38" class="head">Copper IUD</text><text x="25" y="73" class="small">Selected mechanism, not a simulation of contraceptive success</text><rect x="25" y="130" width="225" height="80" rx="9" fill="#1a2d42" stroke="#6d8aa8" stroke-width="2"/><text x="37" y="159" class="">Sperm entry to vagina</text><rect x="350" y="130" width="260" height="80" rx="9" fill="#543f30" stroke="#ffbf76" stroke-width="4"/><text x="362" y="159" class="">Cervix → uterus → tube</text><rect x="710" y="130" width="260" height="80" rx="9" fill="#1a2d42" stroke="#6d8aa8" stroke-width="2"/><text x="722" y="159" class="">Ampullary fertilization</text><path d="M250 170L350 170" stroke="#83c8ff" stroke-width="3" marker-end="url(#a)"/><path d="M610 170L710 170" stroke="#83c8ff" stroke-width="3" marker-end="url(#a)"/><rect x="25" y="285" width="225" height="100" rx="9" fill="#1a2d42" stroke="#6d8aa8" stroke-width="2"/><text x="37" y="314" class="">Testis → epididymis →</text><text x="37" y="339" class="">vas</text><rect x="350" y="285" width="260" height="100" rx="9" fill="#1a2d42" stroke="#6d8aa8" stroke-width="2"/><text x="362" y="314" class="">Hypothalamus → pituitary →</text><text x="362" y="339" class="">ovary</text><rect x="710" y="285" width="260" height="100" rx="9" fill="#1a2d42" stroke="#6d8aa8" stroke-width="2"/><text x="722" y="314" class="">Uterine implantation later</text><path d="M840 210L840 285" stroke="#83c8ff" stroke-width="3" marker-end="url(#a)"/><text x="25" y="440" class="">Copper ions impair sperm movement/function and fertilization</text><text x="25" y="515" class="">Local contraceptive inflammation is not proof of cancer. Does not protect against STIs.</text><text x="25" y="605" class="green">Explanation step 2: Connect target to the relevant event</text><text x="25" y="655" class="small">Dated evidence: CDC 2024, FDA LNG 2022 label review, WHO IUD 2026; checked 2026-11-04.</text></svg>