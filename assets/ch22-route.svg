<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-label="Information and output reached selected targets"><title>Information and output reached selected targets</title><style>text{font:19px system-ui,sans-serif;fill:#edf2fb}.head{font-size:25px;font-weight:650}.small{font-size:17px}</style><rect width="1100" height="680" fill="#101927"/><defs><marker id="ch22-arrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b7c8df"/></marker></defs><rect x="300" y="105" width="520" height="450" rx="20" fill="#1d3044" stroke="#8796ac" stroke-dasharray="6 5"/><text x="320" y="135" class="small">CNS compartment; connectivity, not anatomy</text><text x="25" y="38" class="head">Sensory input, central processing and motor output</text><text x="25" y="75" class="small">Presentation progress 0–100; no physiological time mapping.</text><path data-edge="afferent" d="M170 355L400 355" fill="none" stroke="#83c8ff" stroke-width="4" marker-end="url(#ch22-arrow)"/><path data-edge="ascending" d="M465 330L710 245" fill="none" stroke="#ffbf76" stroke-width="4" marker-end="url(#ch22-arrow)"/><path data-edge="output" d="M480 485L860 485" fill="none" stroke="#7be4b1" stroke-width="4" marker-end="url(#ch22-arrow)"/><path data-edge="central-output" d="M720 255L470 450" fill="none" stroke="#7be4b1" stroke-width="4" marker-end="url(#ch22-arrow)"/><circle data-node="receptor" cx="135" cy="355" r="34" fill="#142237" stroke="#83c8ff" stroke-width="3"/><circle data-node="branch" cx="440" cy="355" r="34" fill="#142237" stroke="#7be4b1" stroke-width="3"/><circle data-node="local" cx="440" cy="485" r="34" fill="#142237" stroke="#7be4b1" stroke-width="3"/><circle data-node="muscle" cx="900" cy="485" r="34" fill="#142237" stroke="#7be4b1" stroke-width="3"/><circle data-node="brain" cx="750" cy="220" r="44" fill="#142237" stroke="#ffbf76" stroke-width="3"/><text x="38" y="415" class="">Peripheral receptor</text><text x="330" y="300" class="">Spinal sensory relay</text><text x="315" y="535" class="">Spinal motor circuitry</text><text x="825" y="535" class="">Muscle target</text><text x="650" y="165" class="">Brainward processing</text><text x="25" y="580" class="head">Information and output reached selected targets</text><text x="25" y="615" class="small">Blue: afferent · amber: ascending · green: motor route; distinct axons and synapses.</text><text x="25" y="650" class="small">Central integration is not required to visit every brain region or to precede every reflex.</text></svg>