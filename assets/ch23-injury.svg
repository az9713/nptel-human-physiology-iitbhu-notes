<path d="M520 462L555 462" fill="none" stroke="#dce7f4" stroke-width="3" marker-end="url(#arr)"/>
<path d="M785 462L820 462" fill="none" stroke="#dce7f4" stroke-width="3" marker-end="url(#arr)"/>
<text x="35" y="590" fill="#b9d3e6" text-anchor="start" font-family="system-ui" font-size="16">Seddon classes are coarse; Sunderland grades refine tissue damage and mixed lesions need separate assessment.</text>
</svg>