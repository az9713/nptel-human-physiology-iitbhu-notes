<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" role="img" aria-labelledby="t d"><title id="t">Thoracic cord, roots and spinal meningeal spaces</title><desc id="d">Dorsal-up nonmetric transverse cord with one sensory dorsal root and ganglion, ventral motor root joining a mixed nerve, and two mixed rami. Midline ependymal region is not represented as an always-open canal. Separate layer strip distinguishes potential subdural interface from CSF subarachnoid space.</desc><style>text{font:19px system-ui;fill:#edf2fb}.head{font-size:24px;font-weight:bold}.small{font-size:16px}.lead{fill:none;stroke:#b9cbe1;stroke-width:2}</style><rect width="1100" height="850" fill="#101927"/><defs><marker id="ch22-cord-arrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#edf2fb"/></marker></defs>
<text x="25" y="38" class="head">Thoracic cord section · dorsal ↑ / ventral ↓ · one side's roots shown</text><text x="25" y="76" class="small">CNS: cord tissue · PNS: root, ganglion and joined nerve; not a vertebral section or a tract atlas.</text>
<ellipse cx="300" cy="310" rx="160" ry="175" fill="#637286" stroke="#d5e4f7" stroke-width="3"/>
<path d="M300 290Q275 255 245 190Q215 190 233 255L246 297L212 315L235 334Q210 354 209 383Q213 429 258 408L285 342L315 342L342 408Q387 429 391 383Q390 354 365 334L388 315L354 297L367 255Q385 190 355 190Q325 255 300 290Z" fill="#493d59" stroke="#c5b0e3" stroke-width="3"/>
<path d="M296 308H304M300 304V312" stroke="#e4c99d" stroke-width="2"/><text x="30" y="132" class="small">Dorsal horn</text><path d="M150 135L241 220" class="lead"/><text x="30" y="510" class="small">Ventral horn</text><path d="M155 498L233 393" class="lead"/><text x="485" y="345" class="small">Lateral horn</text><path d="M480 335L386 315" class="lead"/><text x="450" y="500" class="small">White matter surrounds gray</text><path d="M455 480L410 425" class="lead"/><text x="30" y="555" class="small">Midline ependymal region, not an assumed patent adult-human canal</text><path d="M290 535L300 315" class="lead"/>
<path d="M441 225Q535 178 600 218Q685 230 760 330" stroke="#83c8ff" stroke-width="8" fill="none"/><ellipse cx="600" cy="218" rx="44" ry="28" fill="#26435f" stroke="#83c8ff" stroke-width="3"/><circle cx="597" cy="218" r="10" fill="#83c8ff"/><path d="M690 260L640 230M530 210L464 219" fill="none" stroke="#83c8ff" stroke-width="3" marker-end="url(#ch22-cord-arrow)"/>
<path d="M437 390Q570 470 650 420L760 330" stroke="#7be4b1" stroke-width="8" fill="none"/><path d="M474 410L526 433M673 400L726 355" fill="none" stroke="#7be4b1" stroke-width="3" marker-end="url(#ch22-cord-arrow)"/>
<path d="M760 330H870L960 230M870 330L1010 430" stroke="#c8b7ed" stroke-width="14" fill="none"/>
<text x="510" y="145">Dorsal root ganglion</text><path d="M620 155L610 190" class="lead"/><text x="505" y="185" class="small">Sensory soma; no required relay synapse</text><text x="510" y="480">Ventral root: motor axons</text><text x="745" y="288" class="small">Mixed spinal nerve</text><text x="870" y="195" class="small">Dorsal ramus: mixed</text><text x="850" y="475" class="small">Ventral ramus: mixed</text><text x="35" y="595" class="small">Blue → cord: afferent · green → periphery: efferent. Branch widths do not count axons.</text>
<text x="25" y="640" class="head">Spinal covering order · independent strip, outside → tissue downward</text>
<rect x="30" y="660" width="1040" height="28" fill="#594b40"/><text x="45" y="680" class="small">Vertebral canal boundary (bone and associated tissues)</text><rect x="30" y="688" width="1040" height="29" fill="#473f42"/><text x="45" y="709" class="small">Real spinal epidural region: fat and venous plexus, not CSF</text>
<rect x="30" y="717" width="1040" height="25" fill="#5d506e"/><text x="45" y="736" class="small">Dura; deep border touches arachnoid — subdural is a potential interface</text><path d="M30 742H1070" stroke="#e4c99d" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="30" y="743" width="1040" height="23" fill="#536477"/><text x="45" y="760" class="small">Arachnoid</text><rect x="30" y="766" width="1040" height="30" fill="#173a50"/><text x="45" y="788" class="small">Subarachnoid space: CSF, trabeculae and vessels</text><path d="M30 800H1070" stroke="#7be4b1" stroke-width="4"/><text x="45" y="826" class="small">Pia at cord surface → neural tissue beneath; layers are not to scale</text></svg>
