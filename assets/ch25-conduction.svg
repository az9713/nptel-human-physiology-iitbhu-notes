<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-label="Myelin supports node-to-node propagation"><style>text{font-family:system-ui,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#dcecf5"/></marker></defs><rect width="1000" height="650" fill="#102032"/><text x="30" y="42" font-size="26" fill="#e6eff9" text-anchor="start">Myelin supports node-to-node propagation</text><text x="35" y="85" font-size="18" fill="#e6eff9" text-anchor="start">Matched causal sequence; no millisecond, length or patient calibration</text><text x="35" y="185" font-size="21" fill="#e6eff9" text-anchor="start">Intact myelinated axon</text><path d="M100 260H900" fill="none" stroke="#e0c494" stroke-width="6" /><circle cx="120" cy="260" r="8" fill="#dcecf5" stroke="#fff"/><circle cx="360" cy="260" r="8" fill="#dcecf5" stroke="#fff"/><circle cx="600" cy="260" r="8" fill="#dcecf5" stroke="#fff"/><circle cx="840" cy="260" r="8" fill="#dcecf5" stroke="#fff"/><rect x="145" y="230" width="190" height="60" rx="8" fill="#3f6d7e" stroke="#a6c4d8"/><rect x="385" y="230" width="190" height="60" rx="8" fill="#3f6d7e" stroke="#a6c4d8"/><rect x="625" y="230" width="190" height="60" rx="8" fill="#3f6d7e" stroke="#a6c4d8"/><circle cx="682.5" cy="260" r="13" fill="#ffc766" stroke="#fff"/><text x="35" y="375" font-size="21" fill="#e6eff9" text-anchor="start">One possible demyelinated block</text><path d="M100 450H900" fill="none" stroke="#e0c494" stroke-width="6" /><circle cx="120" cy="450" r="8" fill="#dcecf5" stroke="#fff"/><circle cx="360" cy="450" r="8" fill="#dcecf5" stroke="#fff"/><circle cx="600" cy="450" r="8" fill="#dcecf5" stroke="#fff"/><circle cx="840" cy="450" r="8" fill="#dcecf5" stroke="#fff"/><rect x="145" y="420" width="190" height="60" rx="8" fill="#3f6d7e" stroke="#a6c4d8"/><rect x="625" y="420" width="190" height="60" rx="8" fill="#3f6d7e" stroke="#a6c4d8"/><path d="M480 446V365" fill="none" stroke="#efb56a" stroke-width="4" marker-end="url(#arrow)"/><text x="420" y="352" font-size="18" fill="#e6eff9" text-anchor="start">Current leak</text><text x="350" y="515" font-size="17" fill="#efb56a" text-anchor="start">Selected branch: no distal regeneration</text><circle cx="480" cy="450" r="13" fill="#ffc766" stroke="#fff"/><text x="35" y="590" font-size="19" fill="#e6eff9" text-anchor="start">Regeneration at exposed nodes; current spreads under intact internodes.</text><text x="35" y="623" font-size="17" fill="#e6eff9" text-anchor="start">Myelin loss can slow or block conduction. New myelin cannot revive a dead axon.</text></svg>