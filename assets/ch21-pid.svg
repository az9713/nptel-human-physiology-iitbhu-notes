<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PID conditional mechanism step 3" viewBox="0 0 1000 690"><title>PID conditional mechanism step 3</title><style>text{fill:#edf2fb;font:18px system-ui}.head{font-size:25px;font-weight:700}.small{font-size:15px}.green{fill:#7be4b1}.orange{fill:#ffbf76}</style><rect width="1000" height="690" fill="#101927"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#83c8ff"/></marker></defs><text x="25" y="38" class="head">One possible ascending-infection pathway</text><text x="25" y="73" class="small">Conditional branch sequence, not an inevitable course or a biological clock.</text><rect x="25" y="130" width="220" height="110" rx="9" fill="#1a2d42" stroke="#6d8aa8" stroke-width="2"/><text x="37" y="159" class="">Lower-tract infection</text><path d="M245 185L270 185" stroke="#83c8ff" stroke-width="3" marker-end="url(#a)"/><rect x="270" y="130" width="220" height="110" rx="9" fill="#1a2d42" stroke="#6d8aa8" stroke-width="2"/><text x="282" y="159" class="">Upper-tract</text><text x="282" y="184" class="">inflammation</text><path d="M490 185L515 185" stroke="#83c8ff" stroke-width="3" marker-end="url(#a)"/><rect x="515" y="130" width="220" height="110" rx="9" fill="#1a2d42" stroke="#6d8aa8" stroke-width="2"/><text x="527" y="159" class="">Possible tissue injury</text><path d="M735 185L760 185" stroke="#83c8ff" stroke-width="3" marker-end="url(#a)"/><rect x="760" y="130" width="220" height="110" rx="9" fill="#543f30" stroke="#ffbf76" stroke-width="4"/><text x="772" y="159" class="">Possible persistent</text><text x="772" y="184" class="">scar</text><text x="25" y="320" class="head">Tubal scarring / impaired transport</text><text x="25" y="375" class="">Possible persistent structural sequelae</text><text x="25" y="440" class="">Microbial control does not guarantee reversal of established damage; infertility is not</text><text x="25" y="465" class="">inevitable.</text><rect x="25" y="535" width="450" height="90" rx="9" fill="#1a2d42" stroke="#6d8aa8" stroke-width="2"/><text x="37" y="564" class="">Pathogen-directed care: infection control</text><rect x="525" y="535" width="450" height="90" rx="9" fill="#1a2d42" stroke="#6d8aa8" stroke-width="2"/><text x="537" y="564" class="">Structural sequelae: separate endpoint</text><text x="25" y="665" class="small">No probabilities, disease duration, symptom score, treatment regimen or individual diagnosis modeled.</text></svg>