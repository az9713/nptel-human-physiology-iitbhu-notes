<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-labelledby="t d">
<title id="t">Body compartments and serous potential spaces</title><desc id="d">A hierarchy of dorsal and ventral compartments. A separate transverse abdominal schematic locates a retroperitoneal kidney behind the parietal peritoneum. An enlarged serous membrane diagram distinguishes wall, parietal membrane, fluid film, visceral membrane and organ.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#e7edf0;font-size:21px}.h{font-size:28px;font-weight:700}.s{font-size:17px;fill:#afbec8}.b{fill:#182229;stroke:#4c626f;stroke-width:2}.accent{fill:#8cdbce}.line{fill:none;stroke:#afbec8;stroke-width:2}</style></defs>
<rect width="1200" height="880" rx="12" fill="#10171b"/><text x="35" y="45" class="h">Compartments are not empty bags</text><text x="35" y="77" class="s">Original topology schematic. Geometry, spacing and membrane thickness are illustrative.</text>
<rect x="35" y="105" width="350" height="262" rx="12" class="b"/><text x="55" y="140" class="h">Dorsal compartment</text><rect x="55" y="162" width="310" height="77" rx="8" fill="#243e50"/><text x="75" y="194">Cranial cavity</text><text x="75" y="221" class="s">brain</text><path d="M210 240v22" class="line"/><rect x="55" y="262" width="310" height="77" rx="8" fill="#243e50"/><text x="75" y="294">Vertebral canal</text><text x="75" y="321" class="s">spinal cord; continuous above</text>
<rect x="410" y="105" width="755" height="262" rx="12" class="b"/><text x="430" y="140" class="h">Ventral compartment</text><rect x="430" y="162" width="330" height="173" rx="8" fill="#263c3b"/><text x="448" y="194">Thoracic cavity</text><text x="448" y="227" class="s">Right and left pleural spaces*</text><text x="448" y="256" class="s">Mediastinum contains the</text><text x="448" y="281" class="s">pericardial space* around heart</text><text x="448" y="316" class="s">*thin serous potential spaces</text><path d="M782 165v173" stroke="#ffc66d" stroke-width="5"/><text x="772" y="352" class="s">diaphragm</text><rect x="810" y="162" width="335" height="173" rx="8" fill="#423a2d"/><text x="828" y="194">Abdominopelvic cavity</text><text x="828" y="232">Abdominal region</text><path d="M828 250h298" stroke="#afbec8" stroke-dasharray="5 5"/><text x="828" y="281">Pelvic region</text><text x="828" y="316" class="s">No partition between these.</text>
<text x="35" y="414" class="h">A. Transverse abdomen</text><text x="35" y="444" class="s">Anterior at top; body right is viewer left. No organs to scale.</text>
<ellipse cx="309" cy="625" rx="245" ry="159" fill="#343c42" stroke="#afbec8" stroke-width="3"/><text x="270" y="493" class="s">anterior</text>
<path d="M106 649C82 528 196 514 309 516C422 514 536 528 512 649Q476 670 408 665Q373 664 361 683L257 683Q245 664 210 665Q142 670 106 649Z" fill="#183f3a" stroke="#8cdbce" stroke-width="4"/>
<text x="174" y="570">Peritoneal region</text><text x="140" y="598" class="s">Viscera occupy most of this area;</text><text x="168" y="622" class="s">the fluid film is very thin.</text>
<ellipse cx="181" cy="704" rx="30" ry="19" fill="#ae7866"/><ellipse cx="437" cy="704" rx="30" ry="19" fill="#ae7866"/><circle cx="309" cy="735" r="24" fill="#71818a"/><text x="270" y="802" class="s">posterior</text>
<path d="M438 705h132v-9" class="line"/><text x="397" y="685" class="s">kidney</text><text x="71" y="838" class="s">Retroperitoneum: behind posterior parietal peritoneum.</text><path d="M412 665l120 -38" class="line"/><text x="397" y="619" class="s">parietal peritoneum</text>
<text x="630" y="414" class="h">B. Serous membrane</text><text x="630" y="444" class="s">A local wall-to-organ view; fluid gap exaggerated.</text><rect x="638" y="493" width="58" height="215" fill="#53636a"/><path d="M700 493v215" stroke="#8cdbce" stroke-width="8"/><rect x="709" y="493" width="37" height="215" fill="#378eac"/><path d="M752 493v215" stroke="#ffc66d" stroke-width="8"/><path d="M761 493h115q115 107 0 215H761Z" fill="#ae7866"/>
<path d="M666 710v38h225" class="line"/><text x="902" y="755" class="s">wall</text><path d="M700 520h130v-43h190" class="line"/><text x="930" y="503" class="s">parietal layer</text><path d="M727 564h310" class="line"/><text x="930" y="552" class="s">serous fluid</text><path d="M752 620h285" class="line"/><text x="930" y="610" class="s">visceral layer</text><text x="796" y="668">organ</text><text x="630" y="795" class="s">Pleural, pericardial and peritoneal cavities</text><text x="630" y="821" class="s">are potential spaces between serous layers.</text><text x="630" y="847" class="s">The organ lies outside the serous fluid space.</text>
</svg>

