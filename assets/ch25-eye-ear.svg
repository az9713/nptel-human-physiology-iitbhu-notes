<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" width="1200" height="1040" role="img" aria-label="Separate anatomical contexts: optics, retinal layers and ear compartments"><style>text{font-family:system-ui,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#dcecf5"/></marker></defs><rect width="1200" height="1040" fill="#102032"/><text x="30" y="42" font-size="26" fill="#e6eff9" text-anchor="start">Separate anatomical contexts: optics, retinal layers and ear compartments</text><text x="30" y="84" font-size="20" fill="#e6eff9" text-anchor="start">A. Eye section: optical entry and layered wall (separate schematic scales)</text><ellipse cx="260" cy="270" rx="190" ry="145" fill="#264257" stroke="#d8cbb1" stroke-width="12"/><path d="M300 133A190 145 0 0 1 300 407" fill="none" stroke="#bd7891" stroke-width="13"/><path d="M305 149A170 128 0 0 1 305 391" fill="none" stroke="#7bd0bd" stroke-width="8"/><ellipse cx="157" cy="270" rx="28" ry="62" fill="#b9dfe3" stroke="#fff"/><path d="M25 270H130" fill="none" stroke="#ffd27a" stroke-width="4" marker-end="url(#arrow)"/><text x="18" y="244" font-size="18" fill="#e6eff9" text-anchor="start">Light</text><text x="94" y="180" font-size="17" fill="#e6eff9" text-anchor="start">Cornea</text><path d="M118 185L84 216" fill="none" stroke="#aaa" stroke-width="2" /><text x="130" y="366" font-size="18" fill="#e6eff9" text-anchor="start">Lens</text><path d="M158 350V333" fill="none" stroke="#aaa" stroke-width="2" /><text x="220" y="205" font-size="18" fill="#e6eff9" text-anchor="start">Vitreous</text><path d="M440 280L540 305" fill="none" stroke="#d8cbb1" stroke-width="17" /><text x="442" y="340" font-size="17" fill="#e6eff9" text-anchor="start">Optic nerve</text><text x="320" y="460" font-size="18" fill="#e6eff9" text-anchor="start">Sclera / choroid / retina</text><path d="M360 437L405 367" fill="none" stroke="#aaa" stroke-width="2" /><text x="620" y="124" font-size="20" fill="#e6eff9" text-anchor="start">Retinal layer order (separate scale)</text><rect x="650" y="160" width="215" height="58" rx="8" fill="#25435d" stroke="#a6c4d8"/><text x="662" y="188" font-size="18" fill="#e6eff9" text-anchor="start">Ganglion cells</text><rect x="650" y="245" width="215" height="58" rx="8" fill="#25435d" stroke="#a6c4d8"/><text x="662" y="273" font-size="18" fill="#e6eff9" text-anchor="start">Bipolar pathways</text><rect x="650" y="330" width="215" height="58" rx="8" fill="#25435d" stroke="#a6c4d8"/><text x="662" y="358" font-size="18" fill="#e6eff9" text-anchor="start">Rods / cones</text><rect x="650" y="415" width="215" height="50" rx="8" fill="#604856" stroke="#a6c4d8"/><text x="662" y="443" font-size="18" fill="#e6eff9" text-anchor="start">RPE</text><path d="M610 163V390" fill="none" stroke="#ffd27a" stroke-width="4" marker-end="url(#arrow)"/><text x="560" y="135" font-size="18" fill="#e6eff9" text-anchor="start">Light</text><path d="M903 385V170" fill="none" stroke="#79dccc" stroke-width="4" marker-end="url(#arrow)"/><text x="918" y="230" font-size="18" fill="#e6eff9" text-anchor="start">Signal</text><text x="918" y="255" font-size="17" fill="#e6eff9" text-anchor="start">toward</text><text x="918" y="280" font-size="17" fill="#e6eff9" text-anchor="start">ganglion</text><text x="30" y="520" font-size="20" fill="#e6eff9" text-anchor="start">B. Ear connectivity: air → membrane/ossicles → cochlear fluid → hair-cell signal</text><rect x="30" y="555" width="250" height="80" rx="8" fill="#25435d" stroke="#a6c4d8"/><text x="42" y="583" font-size="18" fill="#e6eff9" text-anchor="start">Pinna / canal</text><path d="M280 595H320" fill="none" stroke="#b8ddeb" stroke-width="4" marker-end="url(#arrow)"/><rect x="322" y="555" width="250" height="80" rx="8" fill="#25435d" stroke="#a6c4d8"/><text x="334" y="583" font-size="18" fill="#e6eff9" text-anchor="start">Tympanic</text><text x="334" y="608" font-size="18" fill="#e6eff9" text-anchor="start">membrane</text><path d="M572 595H612" fill="none" stroke="#b8ddeb" stroke-width="4" marker-end="url(#arrow)"/><rect x="614" y="555" width="250" height="80" rx="8" fill="#25435d" stroke="#a6c4d8"/><text x="626" y="583" font-size="18" fill="#e6eff9" text-anchor="start">Ossicles:</text><text x="626" y="608" font-size="18" fill="#e6eff9" text-anchor="start">malleus/incus/stapes</text><path d="M864 595H904" fill="none" stroke="#b8ddeb" stroke-width="4" marker-end="url(#arrow)"/><rect x="906" y="555" width="250" height="80" rx="8" fill="#25435d" stroke="#a6c4d8"/><text x="918" y="583" font-size="18" fill="#e6eff9" text-anchor="start">Oval window</text><text x="918" y="608" font-size="18" fill="#e6eff9" text-anchor="start">cochlea</text><text x="35" y="676" font-size="18" fill="#e6eff9" text-anchor="start">Vestibular labyrinth: semicircular ducts (rotation); utricle/saccule (linear/tilt)</text><text x="35" y="723" font-size="20" fill="#e6eff9" text-anchor="start">C. Cochlear section (new scale, not a continuous zoom)</text><rect x="40" y="750" width="640" height="42" rx="0" fill="#34475e" stroke="#a6c4d8"/><text x="55" y="778" font-size="18" fill="#e6eff9" text-anchor="start">Scala vestibuli: perilymph</text><path d="M40 796H680" fill="none" stroke="#b0b4cd" stroke-width="3" /><rect x="40" y="800" width="640" height="120" rx="0" fill="#3e6570" stroke="#a6c4d8"/><text x="55" y="826" font-size="18" fill="#e6eff9" text-anchor="start">Scala media: endolymph above apical seal</text><rect x="430" y="851" width="250" height="69" rx="0" fill="#243b53" stroke="#a6c4d8"/><rect x="490" y="851" width="48" height="69" rx="0" fill="#677882" stroke="#a6c4d8"/><rect x="582" y="851" width="48" height="69" rx="0" fill="#677882" stroke="#a6c4d8"/><rect x="547" y="851" width="28" height="69" rx="0" fill="#d1b377" stroke="#a6c4d8"/><path d="M551 849V823 M560 849V819 M569 849V815" fill="none" stroke="#efb56a" stroke-width="3" /><path d="M430 850H680" fill="none" stroke="#b4e5ce" stroke-width="5" /><path d="M40 922H680" fill="none" stroke="#efb56a" stroke-width="4" /><rect x="40" y="927" width="640" height="42" rx="0" fill="#34475e" stroke="#a6c4d8"/><text x="55" y="954" font-size="18" fill="#e6eff9" text-anchor="start">Scala tympani: perilymph</text><text x="55" y="878" font-size="18" fill="#e6eff9" text-anchor="start">Low-K⁺ basolateral fluid</text><text x="55" y="905" font-size="16" fill="#e6eff9" text-anchor="start">(perilymph-like; within the organ)</text><path d="M365 889L475 889" fill="none" stroke="#aaa" stroke-width="2" /><text x="730" y="778" font-size="18" fill="#e6eff9" text-anchor="start">Organ of Corti on basilar membrane</text><path d="M720 785L563 892" fill="none" stroke="#aaa" stroke-width="2" /><text x="730" y="821" font-size="18" fill="#e6eff9" text-anchor="start">Apical seal / reticular lamina</text><text x="730" y="845" font-size="16" fill="#e6eff9" text-anchor="start">Hair/support-cell tight junctions</text><path d="M718 827L644 850" fill="none" stroke="#b4e5ce" stroke-width="2" /><text x="730" y="891" font-size="18" fill="#e6eff9" text-anchor="start">Supporting-cell context</text><path d="M719 896L618 901" fill="none" stroke="#aaa" stroke-width="2" /><text x="730" y="942" font-size="18" fill="#e6eff9" text-anchor="start">Basilar membrane below the organ</text><path d="M719 936L670 922" fill="none" stroke="#efb56a" stroke-width="2" /><text x="40" y="1010" font-size="18" fill="#e6eff9" text-anchor="start">Separate fluid compartments and cell surfaces; no metric dimensions or oscillation timing.</text></svg>