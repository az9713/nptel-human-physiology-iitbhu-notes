<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-label="Blood–brain barrier: name both sides of the wall"><style>text{font-family:system-ui,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#dcecf5"/></marker></defs><rect width="1000" height="720" fill="#102032"/><text x="30" y="42" font-size="26" fill="#e6eff9" text-anchor="start">Blood–brain barrier: name both sides of the wall</text><text x="35" y="82" font-size="17" fill="#e6eff9" text-anchor="start">Sectional topology: exaggerated thicknesses; no measured permeability</text><rect x="45" y="110" width="880" height="120" rx="8" fill="#603b50" stroke="#a6c4d8"/><text x="65" y="147" font-size="22" fill="#e6eff9" text-anchor="start">Blood lumen / plasma</text><rect x="45" y="230" width="408" height="100" rx="0" fill="#255977" stroke="#a6c4d8"/><rect x="467" y="230" width="458" height="100" rx="0" fill="#255977" stroke="#a6c4d8"/><text x="65" y="272" font-size="19" fill="#e6eff9" text-anchor="start">Nonfenestrated endothelial cell</text><text x="485" y="272" font-size="19" fill="#e6eff9" text-anchor="start">Adjacent endothelial cell</text><path d="M460 230V330" fill="none" stroke="#ffc766" stroke-width="9" /><text x="55" y="365" font-size="17" fill="#e6eff9" text-anchor="start">Tight junction between cells</text><path d="M320 353L454 298" fill="none" stroke="#ffc766" stroke-width="2" /><rect x="45" y="380" width="880" height="48" rx="0" fill="#6b617a" stroke="#a6c4d8"/><text x="530" y="410" font-size="17" fill="#e6eff9" text-anchor="start">Basement membrane (matrix)</text><rect x="110" y="388" width="260" height="30" rx="8" fill="#875467" stroke="#a6c4d8"/><text x="132" y="410" font-size="16" fill="#e6eff9" text-anchor="start">Pericyte in matrix</text><rect x="45" y="450" width="310" height="54" rx="8" fill="#477252" stroke="#a6c4d8"/><rect x="385" y="450" width="260" height="54" rx="8" fill="#477252" stroke="#a6c4d8"/><rect x="675" y="450" width="250" height="54" rx="8" fill="#477252" stroke="#a6c4d8"/><text x="65" y="483" font-size="19" fill="#e6eff9" text-anchor="start">Astrocyte endfeet: supporting processes</text><text x="55" y="555" font-size="21" fill="#e6eff9" text-anchor="start">Brain interstitium: extracellular fluid around neural cells</text><path d="M660 180V546" fill="none" stroke="#7fe2de" stroke-width="5" marker-end="url(#arrow)"/><text x="680" y="185" font-size="18" fill="#e6eff9" text-anchor="start">Glucose / GLUT1</text><text x="680" y="210" font-size="16" fill="#e6eff9" text-anchor="start">membrane transport</text><rect x="643" y="227" width="34" height="17" rx="0" fill="#7fe2de" stroke="#a6c4d8"/><rect x="643" y="320" width="34" height="17" rx="0" fill="#7fe2de" stroke="#a6c4d8"/><path d="M375 180V546" fill="none" stroke="#dfb3ed" stroke-width="4" marker-end="url(#arrow)"/><text x="390" y="310" font-size="17" fill="#e6eff9" text-anchor="start">O₂ diffusion</text><path d="M460 170V220" fill="none" stroke="#ffc766" stroke-width="3" marker-end="url(#arrow)"/><path d="M448 223H472" fill="none" stroke="#ffc766" stroke-width="5" /><text x="55" y="603" font-size="18" fill="#e6eff9" text-anchor="start">Between-cell passage is restricted; transport through cells is a distinct route.</text><text x="55" y="638" font-size="17" fill="#e6eff9" text-anchor="start">Endfeet do not replace endothelial junctions. Plexus blood–CSF barrier differs.</text><text x="55" y="679" font-size="17" fill="#e6eff9" text-anchor="start">Marker: selected route position only; presentation time is not physiological time.</text><circle cx="660" cy="363" r="9" fill="#ffc766" stroke="#fff"/></svg>