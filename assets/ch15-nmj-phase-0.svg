<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 445" role="img" aria-label="Nerve action potential reaches terminal."><rect width="860" height="445" fill="#0d1723"/><rect x="80" y="50" width="690" height="150" fill="#195c58"/><rect x="80" y="200" width="690" height="100" fill="#152332"/><rect x="80" y="300" width="690" height="115" fill="#19505a"/><path d="M80 200 V50 H770 V200" fill="none" stroke="#68c9bd" stroke-width="2"/><text x="100" y="80" font-size="18" fill="#e5edf5">Nerve-terminal cytosol</text><text x="100" y="185" font-size="15" fill="#e5edf5">Terminal plasma membrane</text><text x="100" y="235" font-size="18" fill="#e5edf5">Extracellular cleft</text><text x="100" y="345" font-size="18" fill="#e5edf5">Muscle cytosol</text><text x="90" y="35" font-size="19" fill="#e5edf5">Motor endplate belongs to muscle; separate cell membranes</text><circle data-role="reserve-vesicle" cx="675" cy="115" r="22" fill="#2a3d51" stroke="#f5c47a" stroke-width="3"/><text x="550" y="85" font-size="15" fill="#e5edf5">Closed reserve vesicle</text><path data-role="terminal-membrane" d="M80 200 H770" fill="none" stroke="#68c9bd" stroke-width="4"/><path data-role="sarcolemma" d="M80 300 H770" stroke="#69d7c5" stroke-width="6"/><text x="100" y="282" font-size="15" fill="#e5edf5">Muscle sarcolemma / endplate</text><text x="100" y="390" font-size="17" fill="#e5edf5">Cytosolic muscle calcium is a later, separate signal</text><circle data-role="primed-vesicle" cx="430" cy="145" r="25" fill="#2a3d51" stroke="#f5c47a" stroke-width="4"/><text x="465" y="150" font-size="16" fill="#e5edf5">Primed vesicle lumen</text></svg>