<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc"><title id="title">Separate-scale testicular anatomy and duct connections</title><desc id="desc">Original unscaled topology: capsule, coiled tubules, rete, efferent ducts and epididymis connect to vas and ejaculatory ducts. Secretions enter a separate urethral route. A flattened tubule wall places Sertoli junctions between basal and adluminal compartments and Leydig cells outside.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8ed9e8"/></marker></defs><style>text{font:19px system-ui;fill:#edf2f8}.small{font-size:16px}.label{font-weight:bold}.duct{fill:none;stroke:#8ed9e8;stroke-width:4;marker-end:url(#arr)}.secret{fill:none;stroke:#f6c36b;stroke-width:3;stroke-dasharray:7 4;marker-end:url(#arr)}.lead{fill:none;stroke:#c5cfdb;stroke-width:1.5}</style><rect width="1200" height="950" fill="#152332"/><text x="25" y="30" class="label">A. Organ connectivity • schematic cutaway and pelvic landmarks • no metric scale</text><text x="25" y="60" class="small">Posterior attachment shown at right of testis; paired routes represented by one side.</text><path d="M373 148C270 25 60 90 68 285C72 465 180 538 373 425" fill="none" stroke="#829bb9" stroke-width="3" stroke-dasharray="6 5"/><path d="M362 117C180 0 40 135 60 312C72 465 245 548 363 457" fill="none" stroke="#b7cbe4" stroke-width="3"/><ellipse cx="240" cy="285" rx="155" ry="190" fill="#472f48" stroke="#dbb2bd" stroke-width="8"/><path d="M350 130V410" stroke="#8ed9e8" stroke-width="7"/><text x="20" y="510" class="small">Albuginea: solid capsule; vaginalis: outer serous layers</text><path d="M128 170C260 115 100 275 235 230S130 345 275 290S180 430 310 365" fill="none" stroke="#eeb3c5" stroke-width="9"/><path class="duct" d="M128 170Q170 125 225 130H350"/><path class="duct" d="M310 365H350"/><path class="duct" d="M350 145Q380 120 405 140"/><path d="M410 135C455 140 392 175 435 190S390 235 435 255S390 300 435 320S395 370 425 408" fill="none" stroke="#7ec8bd" stroke-width="10"/><path class="duct" d="M425 408H495V90H790V180L825 220"/><text x="110" y="190">Coiled tubules</text><path class="lead" d="M270 185L240 220"/><text x="155" y="390" class="small">Straight tubule → rete</text><text x="335" y="90" class="small">Efferent ductules → head</text><text x="500" y="300" class="small">Epididymal body</text><path class="lead" d="M500 305L438 285"/><text x="435" y="445" class="small">Tail → vas</text><text x="520" y="74" class="small">Vas in cord → inguinal canal → posterior bladder</text><ellipse cx="820" cy="290" rx="70" ry="60" fill="#304857" stroke="#839eb7" stroke-width="2"/><text x="777" y="290">Bladder</text><text x="765" y="313" class="small">urine lumen</text><path class="duct" d="M820 350V440Q820 500 900 500H1090"/><ellipse cx="820" cy="380" rx="92" ry="40" fill="#64503e" stroke="#f6c36b" stroke-width="2"/><text x="730" y="376" class="small">One prostate</text><path d="M820 350V440" fill="none" stroke="#8ed9e8" stroke-width="4"/><path class="duct" d="M825 220Q920 245 920 320L850 370L820 395"/><text x="920" y="325" class="small">Ejaculatory duct</text><path class="lead" d="M920 330L910 310"/><ellipse cx="955" cy="173" rx="58" ry="35" fill="#64503e" stroke="#f6c36b" stroke-width="2"/><text x="1025" y="175" class="small">Vesicle</text><path class="secret" d="M898 173L825 220"/><text x="865" y="220" class="small">Duct joins vas</text><path class="secret" d="M780 400L820 405"/><text x="930" y="398" class="small">Prostate ducts → urethra</text><ellipse cx="960" cy="440" rx="28" ry="18" fill="#64503e" stroke="#f6c36b" stroke-width="2"/><path class="secret" d="M935 447L858 480"/><text x="1000" y="445" class="small">Bulbourethral</text><text x="915" y="535" class="small">Spongy urethra → exterior</text><text x="28" y="555" class="small">Blue solid: connected duct/urethral route. Gold dashed: gland secretions enter it; sperm do not cross gland tissue.</text><path d="M28 580H1170" stroke="#829bb9"/><text x="25" y="610" class="label">B. Flattened tubule wall • separate microscopic scale • not a continuous photographic zoom</text><rect x="100" y="630" width="1000" height="62" fill="#213b48"/><rect x="100" y="692" width="1000" height="125" fill="#373c56"/><rect x="100" y="817" width="1000" height="58" fill="#4b3b4d"/><rect x="100" y="880" width="1000" height="55" fill="#344631"/><path d="M100 878H1100" stroke="#e0c9d2" stroke-width="5"/><path d="M100 817H1100" stroke="#f6c36b" stroke-width="3" stroke-dasharray="7 4"/><path d="M305 875L295 720Q320 670 340 710L355 875M655 875L650 720Q675 670 695 710L710 875" fill="#488c86" stroke="#89cdc3" stroke-width="2"/><g fill="#eab4d1" stroke="#eee0ec"><circle cx="220" cy="846" r="19"/><circle cx="460" cy="780" r="27"/><circle cx="560" cy="741" r="19"/><circle cx="800" cy="710" r="13"/><ellipse cx="940" cy="690" rx="9" ry="17"/></g><path d="M940 675Q920 655 944 640Q965 627 947 635" fill="none" stroke="#eab4d1" stroke-width="3"/><ellipse cx="520" cy="908" rx="42" ry="16" fill="#f6c36b"/><path d="M690 905H1010" stroke="#e78085" stroke-width="9"/><text x="110" y="660">Lumen: released sperm and fluid</text><text x="110" y="731" class="small">Adluminal</text><text x="110" y="760" class="small">germ cells</text><text x="740" y="798" class="small">Inter-Sertoli junction boundary</text><text x="110" y="853" class="small">Basal</text><text x="365" y="860" class="small">Sertoli support (green)</text><text x="110" y="913" class="small">Interstitium outside basement membrane</text><text x="568" y="915" class="small">Leydig</text><text x="870" y="928" class="small">Blood vessel</text></svg>