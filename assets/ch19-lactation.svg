<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lactation pathways and exact inventory balance" viewBox="0 0 1000 790"><title>Lactation pathways and exact inventory balance</title><style>text{font:18px system-ui,sans-serif;fill:#edf2fb}.small{font-size:15px}.head{font-size:25px;font-weight:700}.blue{fill:#83c8ff}.orange{fill:#ffbf76}.green{fill:#7be4b1}</style><rect width="1000" height="790" fill="#101927"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#83c8ff"/></marker></defs><text x="28" y="38" class="head">Synthesis, ejection and inventory are distinct</text><text x="28" y="72" class="small">Artificial teaching time; constants are not human hormone kinetics or mL.</text><rect x="30" y="110" width="230" height="80" rx="8" fill="#1a2d42" stroke="#6885a5"/><text x="42" y="140" class="">Nipple sensory</text><text x="42" y="164" class="">afferents</text><rect x="345" y="110" width="280" height="80" rx="8" fill="#1a2d42" stroke="#6885a5"/><text x="357" y="140" class="">Hypothalamus</text><path d="M260 150L345 150" fill="none" stroke="#83c8ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="250" width="350" height="80" rx="8" fill="#1a2d42" stroke="#6885a5"/><text x="72" y="280" class="">Dopamine inhibition decreases</text><rect x="60" y="380" width="350" height="80" rx="8" fill="#1a2d42" stroke="#6885a5"/><text x="72" y="410" class="">Anterior pituitary: prolactin</text><path d="M415 190L240 250" fill="none" stroke="#83c8ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M230 330L230 380" fill="none" stroke="#83c8ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="250" width="370" height="80" rx="8" fill="#1a2d42" stroke="#6885a5"/><text x="592" y="280" class="">Axons: hypothalamic oxytocin</text><rect x="580" y="380" width="370" height="80" rx="8" fill="#1a2d42" stroke="#6885a5"/><text x="592" y="410" class="">Posterior pituitary: release to blood</text><path d="M550 190L760 250" fill="none" stroke="#83c8ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M760 330L760 380" fill="none" stroke="#83c8ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M230 460L230 485" fill="none" stroke="#83c8ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M760 460L760 485" fill="none" stroke="#83c8ff" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="510" class="green">Alveolar epithelium: synthesis S</text><text x="590" y="510" class="orange">Myoepithelial basket: ejection kA</text><text x="28" y="560" class="">τ = 5.0; S = 2; k = 0.2; stored A = 24.715; delivered D = 35.285</text><text x="28" y="600" class="">A + D = 60.000 = initial 50 + synthesized 10.000</text><text x="28" y="635" class="small">Output assumes open duct and effective removal; real infant transfer is a separate process.</text><rect x="30" y="690" width="250" height="70" rx="8" fill="#1a2d42" stroke="#6885a5"/><text x="42" y="720" class="">Milk ejection</text><rect x="365" y="690" width="270" height="70" rx="8" fill="#1a2d42" stroke="#6885a5"/><text x="377" y="720" class="">Effective milk transfer</text><rect x="720" y="690" width="250" height="70" rx="8" fill="#1a2d42" stroke="#6885a5"/><text x="732" y="720" class="">Continued suckling</text><path d="M280 725L365 725" fill="none" stroke="#83c8ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M635 725L720 725" fill="none" stroke="#83c8ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M970 725L985 725L985 95L145 95L145 110" fill="none" stroke="#83c8ff" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="28" y="675" class="small">Conditional reinforcing loop: transfer and infant behavior are not simulated.</text></svg>