<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="t d"><title id="t">Separate pelvic compartments and support relationships</title><desc id="d">Original nonmetric sagittal female topology: bladder anterior to vagina and uterus, rectum posterior, separate urethra, vagina and anus crossing the pelvic outlet, with muscular floor and connective support. Separate male outlet inset places prostate around urethra below bladder. Not a measured pelvic model or disease stage.</desc><rect width="1100" height="650" fill="#101927"/><style>text{font:18px system-ui;fill:#edf2fb}.head{font-size:24px;font-weight:700}.small{font-size:15px}.lead{stroke:#b6c6db;stroke-width:2;fill:none}</style><text x="25" y="38" class="head">A. Sagittal compartment topology · female pelvis</text><text x="25" y="73" class="small">Anterior ←                                    → Posterior. Separate lumens; no metric scale.</text>
<ellipse cx="180" cy="255" rx="78" ry="65" fill="#244e65" stroke="#83c8ff" stroke-width="4"/><path d="M180 320L180 480" stroke="#83c8ff" stroke-width="12"/>
<path d="M345 145Q420 120 440 195Q445 250 390 285L365 350L330 333L345 270Q285 230 315 175Z" fill="#684358" stroke="#ffbf76" stroke-width="4"/><path d="M346 327Q300 380 290 480" fill="none" stroke="#b5a2ff" stroke-width="35"/>
<path d="M530 175Q565 280 505 340Q465 400 510 480" fill="none" stroke="#a5c798" stroke-width="40"/>
<path d="M75 420L155 438 M205 445L260 449 M315 449L470 437 M535 428L570 420" stroke="#7be4b1" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M430 170L565 115M365 335L565 270" stroke="#7be4b1" stroke-width="5" stroke-dasharray="8 5"/>
<text x="30" y="150">Bladder</text><path d="M100 155L150 198" class="lead"/><text x="295" y="110">Uterus</text><path d="M355 116L369 145" class="lead"/><text x="505" y="95">Connective support</text><text x="25" y="535">Urethra</text><path d="M145 524L180 478" class="lead"/><text x="250" y="535">Vagina</text><path d="M285 515L290 478" class="lead"/><text x="495" y="535">Anus / rectum</text><path d="M525 515L510 478" class="lead"/>
<text x="25" y="585" class="small">Green: muscular floor and connective attachments; not one ligament acting alone.</text><text x="25" y="615" class="small">Support loss can involve anterior, apical or posterior compartments. No stage assigned.</text>
