<text x="720" y="105" class="head">B. Separate male outlet context</text><ellipse cx="870" cy="250" rx="80" ry="65" fill="#244e65" stroke="#83c8ff" stroke-width="4"/><ellipse cx="870" cy="355" rx="65" ry="47" fill="#684358" stroke="#ffbf76" stroke-width="4"/><path d="M870 310L870 475" stroke="#83c8ff" stroke-width="13"/><text x="725" y="170">Bladder → urethra</text><text x="725" y="510">Prostate surrounds proximal urethra.</text><text x="725" y="555" class="small">BPH: benign growth / outlet resistance</text><text x="725" y="582" class="small">Prostatitis: inflammatory syndromes</text><text x="725" y="609" class="small">Cancer: malignant growth; distinct process</text></svg>