<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Follicle and oocyte stage 3" viewBox="0 0 1000 660"><title>Follicle and oocyte stage 3</title><style>text{font:18px system-ui,sans-serif;fill:#edf2fb}.small{font-size:15px}.head{font-size:25px;font-weight:700}.blue{fill:#83c8ff}.orange{fill:#ffbf76}.green{fill:#7be4b1}</style><rect width="1000" height="660" fill="#101927"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#83c8ff"/></marker></defs><text x="28" y="40" class="head">Antral follicle</text><text x="28" y="75" class="small">Already growing before cyclic selection</text><circle cx="265" cy="285" r="170" fill="#243448" stroke="#ffbf76" stroke-width="3"/><circle cx="265" cy="285" r="150" fill="#295855" stroke="#7be4b1" stroke-width="3"/><circle cx="305" cy="285" r="98" fill="#15334e" stroke="#83c8ff" stroke-width="3"/><circle cx="210" cy="285" r="84" fill="none" stroke="#7be4b1" stroke-width="6"/><circle cx="210" cy="285" r="74" fill="#18263b" stroke="#b5a2ff" stroke-width="8"/><circle cx="210" cy="285" r="46" fill="#443156" stroke="#ffbf76" stroke-width="2"/><text x="182" y="291" class="orange">2n 4C</text><rect x="570" y="120" width="400" height="105" rx="8" fill="#1a2d42" stroke="#6885a5"/><text x="582" y="150" class="">Fluid antrum; mural granulosa and</text><text x="582" y="174" class="">cumulus</text><rect x="570" y="245" width="400" height="105" rx="8" fill="#1a2d42" stroke="#6885a5"/><text x="582" y="275" class="">Primary oocyte: prophase I arrest</text><text x="585" y="395" class="small">OOCYTE / MATERNAL PRODUCT ONLY</text><text x="585" y="430" class="">46 chromosomes; 92 chromatids</text><text x="28" y="468" class="small">Green: granulosa; purple: zona when developed; outer orange: theca when present.</text><text x="28" y="510" class="">Stage index is a presentation sequence, not equal elapsed biological time. Rings and colors</text><text x="28" y="534" class="">encode compartments; dimensions and colors are not measured anatomy.</text><text x="28" y="590" class="">Granulosa and theca are somatic cells. Their DNA is excluded. Polar body DNA is excluded from</text><text x="28" y="614" class="">this one-oocyte counter.</text></svg>