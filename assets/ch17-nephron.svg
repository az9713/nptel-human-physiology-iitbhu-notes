<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">Nephron segments and separate collecting duct and vasa recta</title><desc id="desc">Original schematic long-loop nephron. Renal corpuscle and convoluted tubules lie in cortex. A descending and ascending loop extends into medulla. Collecting duct also traverses medulla. Blood in the vasa recta is a separate countercurrent route.</desc>
