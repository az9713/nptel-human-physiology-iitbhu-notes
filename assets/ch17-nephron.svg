<g font-family="system-ui" fill="#eef2f7" font-size="21"><text x="45" y="70">CORTEX</text><text x="45" y="345">MEDULLA</text><text x="45" y="735">Separate scales · topology only · long-loop example · no physical scale</text></g>
<path d="M150 180h-60v-55" stroke="#ee8c93" stroke-width="10" fill="none"/><path d="M150 153L95 100" stroke="#b6a7ff" stroke-width="8" fill="none"/>
