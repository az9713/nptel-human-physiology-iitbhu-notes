<g font-family="system-ui" fill="#eef2f7" font-size="20"><text x="90" y="95">Afferent blood</text><text x="130" y="270">Corpuscle</text><text x="260" y="125">Proximal</text><text x="260" y="150">convoluted tubule</text><text x="575" y="115">Distal tubule</text><text x="650" y="170">Connecting</text><text x="650" y="195">segment</text><text x="710" y="85">Collecting duct</text><text x="265" y="475">Descending</text><text x="275" y="500">thin limb</text><text x="565" y="420">Thick</text><text x="565" y="445">ascending</text><text x="565" y="470">limb (TAL)</text><text x="440" y="685">Thin ascending portion near bend</text><text x="800" y="280">Vasa recta</text><text x="795" y="655">BLOOD</text><text x="90" y="575">Interstitial tissue</text><text x="90" y="600">surrounds each tube</text></g>
