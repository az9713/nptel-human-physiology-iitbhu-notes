<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="t d">
<title id="t">Conceptual animal cell and its compartments</title><desc id="d">A schematic cell with a nucleus, pores, continuous endoplasmic reticulum, Golgi, mitochondria, lysosome, peroxisome and cytoskeleton. Shapes, sizes and colours are illustrative.</desc>
