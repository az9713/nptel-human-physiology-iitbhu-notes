<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
<title id="title">Kidney section and two nephron arrangements at separate scales</title><desc id="desc">A left kidney sectional schematic distinguishes capsule, cortex, medullary pyramids, sinus, calyces, pelvis and ureter. A separate right panel places both cortical and juxtamedullary corpuscles in cortex, with short versus long loops reaching medulla and a shared collecting duct descending toward a papilla. Dotted correspondence is conceptual, not a continuous magnification or a measured section.</desc>
<defs><marker id="ch16-context-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9adbd5"/></marker></defs>
<rect width="1100" height="720" rx="12" fill="#14242e"/>
<g fill="#f1f4f6" font-family="system-ui,sans-serif"><text x="30" y="38" font-size="24">A. Organ section — anatomical orientation</text><text x="590" y="38" font-size="24">B. Nephron arrangement — separate scale</text></g>
<!-- Original sectional reconstruction, not atlas segmentation. -->
<path d="M275 90C160 50 65 145 65 295C65 460 170 560 280 510C345 480 355 413 306 373C265 340 263 271 305 238C353 202 350 119 275 90Z" fill="#9d6665" stroke="#e1bfb6" stroke-width="6"/>
<path d="M265 124C178 93 101 168 101 295C101 425 180 503 267 476C310 460 319 421 284 393C233 352 234 256 282 216C315 189 313 144 265 124Z" fill="#633e52"/>
<!-- Cortical columns extend continuously inward from the outer cortical band. -->
