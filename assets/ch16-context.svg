<g fill="#f1f4f6" font-family="system-ui,sans-serif" font-size="18"><text x="580" y="105">Cortex</text><text x="580" y="365">Medulla</text><text x="590" y="151">Cortical</text><text x="746" y="283">Juxtamedullary</text></g>
