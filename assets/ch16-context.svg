<g fill="#ba8d9d" stroke="#e1bfb6" stroke-width="2"><path d="M135 185L230 150L251 257Z"/><path d="M112 273L142 210L237 282Z"/><path d="M118 319L153 391L236 316Z"/><path d="M168 429L246 463L255 353Z"/></g>
<ellipse id="ch16-sinus-cavity" cx="320" cy="310" rx="82" ry="112" fill="#14242e" stroke="#8d9ca3" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M257 240Q325 280 323 315Q323 350 263 375L292 400Q365 367 369 318Q370 260 286 214Z" fill="#c7aa6b"/>
<g fill="none" stroke="#f0d68b" stroke-width="9" stroke-linecap="round"><path d="M239 246L281 273L324 300"/><path d="M231 283L279 296L324 307"/><path d="M232 317L280 322L324 319"/><path d="M250 357L284 343L327 327"/><path d="M326 312Q357 319 356 378V514"/></g>
<g stroke="#d3e2e8" stroke-width="1.5" fill="none"><path d="M65 295H25V115H105"/><path d="M112 165H20V570H150"/><path d="M142 277L22 280"/><path d="M201 327L28 450"/><path id="ch16-sinus-leader" d="M384 245L398 188"/><path d="M328 312L440 312"/><path d="M356 459H440"/><path d="M160 296L394 526"/></g>
<circle cx="160" cy="296" r="3" fill="#e7f0f2"/>
<g fill="#f1f4f6" font-family="system-ui,sans-serif" font-size="18"><text x="110" y="118">Fibrous capsule</text><text x="155" y="575">Outer cortex</text><text x="26" y="265">Pyramid</text><text x="25" y="473">Medulla</text><text x="363" y="160">Sinus: cavity with</text><text x="363" y="183">pelvis, vessels, fat</text><text x="389" y="293">Renal pelvis</text><text x="389" y="482">Ureter</text><text x="375" y="550">Cortical column</text><text x="50" y="606" font-size="15">Pale branches summarize calyces; cups are not resolved.</text><text x="50" y="635">Pyramid tip = papilla → minor calyx</text><text x="50" y="665">→ major calyx → pelvis → ureter</text><text x="50" y="699" font-size="15">Columns share the outer cortex's fill; sinus cavity is unfilled.</text></g>
<path d="M286 160C397 110 485 101 554 130" fill="none" stroke="#9adbd5" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ch16-context-arrow)"/>
<text x="371" y="82" fill="#9adbd5" font-family="system-ui,sans-serif" font-size="15">Conceptual correspondence</text>
